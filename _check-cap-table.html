<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/donjon/css/main.css">
<link rel="stylesheet" href="/donjon/css/modules.css">
<link rel="stylesheet" href="/donjon/css/compendium-modules.css">
</head>
<body class="theme-light" style="padding:24px;">
  <div class="modif-section">
    <div class="modif-section__header" style="display:flex; justify-content:space-between; align-items:center;">
      <span class="modif-section__label">Section 3 — Capacités spéciales</span>
      <button type="button" class="btn btn-secondary btn-sm">+ Nouvelle capacité</button>
    </div>
    <div class="table-scroll">
      <table class="table-classe-modif table-classe-modif--liste" id="classe-cap-table">
        <thead>
          <tr>
            <th style="width:60px;">Niveau(x)</th>
            <th>Nom</th>
            <th style="width:60px;">Type</th>
            <th>Description</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>3</td>
            <td>Inspiration lunaire</td>
            <td></td>
            <td><em style="color:#888; font-size:.85em;">(contenu)</em></td>
            <td class="col-actions">
              <button type="button" class="btn btn-sm">M</button>
              <button type="button" class="btn btn-sm btn-danger">S</button>
            </td>
          </tr>
          <tr>
            <td>5, 11 (2/jour)</td>
            <td>Frappe éclatante</td>
            <td>Ext</td>
            <td><em style="color:#888; font-size:.85em;">—</em></td>
            <td class="col-actions">
              <button type="button" class="btn btn-sm">M</button>
              <button type="button" class="btn btn-sm btn-danger">S</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
